name: Build EFD iOS (.ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup CMake & Ninja
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Generate Xcode Project for iOS
        run: |
          mkdir -p build/ios
          cmake -B build/ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DEFD_BUILD_TESTS=OFF \
            -DEFD_BUILD_CLI=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED="NO" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=""

      - name: Build EFD iOS Target
        run: |
          set +e
          echo "=== Archiving EFD_iOS ==="
          xcodebuild archive \
            -project build/ios/EFD.xcodeproj \
            -scheme EFD_iOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${PWD}/build/EFD_iOS.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            > build.log 2>&1
          BUILD_STATUS=$?
          echo "Xcodebuild archive exited with code: $BUILD_STATUS"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          git add -f build.log
          git commit -m "debug: save build.log"
          git push -f origin debug-log || true
          git checkout main || git checkout - || true

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== BUILD LOG (LAST 80 LINES) ==="
            tail -n 80 build.log
            exit $BUILD_STATUS
          fi

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild_log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package App into .ipa
        run: |
          mkdir -p package/Payload
          
          echo "=== Locating EFD_iOS.app Bundle ==="
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData build -name "EFD_iOS.app" -type d -exec test -f "{}/EFD_iOS" \; -print | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR="${PWD}/build/EFD_iOS.xcarchive/Products/Applications/EFD_iOS.app"
          fi
          if [ ! -d "$APP_DIR" ]; then
            APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData build -name "EFD_iOS.app" -type d | head -n 1)
          fi
          
          echo "Found App Bundle directory: $APP_DIR"
          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
            echo "ERROR: EFD_iOS.app not found! Listing DerivedData and build directory:"
            find ~/Library/Developer/Xcode/DerivedData build -maxdepth 5 2>/dev/null || true
            exit 1
          fi

          echo "=== Listing files in $APP_DIR ==="
          ls -la "$APP_DIR"

          # Verify EFD_iOS binary exists inside the app bundle
          if [ ! -f "$APP_DIR/EFD_iOS" ]; then
            echo "Searching for EFD_iOS binary in build directory..."
            BIN_PATH=$(find build -type f -name "EFD_iOS" 2>/dev/null | head -n 1)
            if [ -n "$BIN_PATH" ]; then
              echo "Found binary at $BIN_PATH, copying into $APP_DIR..."
              cp "$BIN_PATH" "$APP_DIR/EFD_iOS"
            else
              echo "CRITICAL ERROR: Main binary EFD_iOS could not be found anywhere in build/!"
              find build -type f
              exit 1
            fi
          fi

          chmod +x "$APP_DIR/EFD_iOS"
          rm -rf "$APP_DIR/_CodeSignature"

          echo "=== Copying assets into App Bundle ==="
          cp -f "ios/logo.png" "$APP_DIR/" 2>/dev/null || true
          cp -f "ios/資產 10.png" "$APP_DIR/" 2>/dev/null || true
          cp -f "design/1x/資產 10.png" "$APP_DIR/" 2>/dev/null || true

          echo "=== Verified executable info ==="
          ls -lh "$APP_DIR/EFD_iOS"
          file "$APP_DIR/EFD_iOS" || true

          cp -R "$APP_DIR" package/Payload/
          cd package
          zip -r ../EFD_iOS.ipa Payload
          cd ..
          echo "=== Generated IPA size: $(ls -lh EFD_iOS.ipa) ==="

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EFD_iOS_ipa
          path: EFD_iOS.ipa
          retention-days: 14
