name: Build EFD iOS (.ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup CMake & Ninja
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Generate Xcode Project for iOS
        run: |
          mkdir -p build/ios
          cmake -B build/ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DEFD_BUILD_TESTS=OFF \
            -DEFD_BUILD_CLI=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED="NO" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED="NO" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=""

      - name: Build EFD iOS Target
        run: |
          xcodebuild -project build/ios/EFD.xcodeproj \
            -scheme EFD_iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CONFIGURATION_BUILD_DIR="${PWD}/build/output" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log || (echo "=== XCODEBUILD BUILD FAILURE LOG (LAST 80 LINES) ===" && tail -n 80 build.log && exit 1)

      - name: Package App into .ipa
        run: |
          mkdir -p package/Payload
          APP_PATH="${PWD}/build/output/EFD_iOS.app"
          if [ ! -f "$APP_PATH/EFD_iOS" ]; then
            echo "Searching in build directory for EFD_iOS executable..."
            APP_PATH=$(find build -name "EFD_iOS.app" -type d -exec test -f "{}/EFD_iOS" \; -print | head -n 1)
          fi
          echo "=== Found Compiled App Bundle: $APP_PATH ==="
          ls -la "$APP_PATH"
          if [ ! -f "$APP_PATH/EFD_iOS" ]; then
            echo "CRITICAL ERROR: Main binary EFD_iOS was not found in $APP_PATH!"
            exit 1
          fi
          echo "=== Verified executable size: $(ls -lh "$APP_PATH/EFD_iOS") ==="
          cp -R "$APP_PATH" package/Payload/
          cd package
          zip -r ../EFD_iOS.ipa Payload
          cd ..
          echo "=== Generated IPA size: $(ls -lh EFD_iOS.ipa) ==="

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EFD_iOS_ipa
          path: EFD_iOS.ipa
          retention-days: 14
